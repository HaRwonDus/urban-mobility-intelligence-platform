services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: "Urban Mobility DB"
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d 'Urban Mobility DB'"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    environment:
      DATABASE_URL: postgresql://mobility:mobility@postgres:5432/Urban%20Mobility%20DB
      WANDB_MODE: disabled
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      API_ADDR: 0.0.0.0:8000
      DATABASE_URL: postgres://mobility:mobility@postgres:5432/Urban%20Mobility%20DB
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8010
      DGIS_API_KEY: ${DGIS_API_KEY:-replace_me}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
